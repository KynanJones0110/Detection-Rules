title: T1569-Impacket-SMBexec-Comspec-Remote-Service-Injection
id: 0f06a3a5-6a09-413f-8743-e6cf35561297
status: development
description: Detects Impacket's SMBexec abusing cmd.exe or powershell.exe to download and execute a backdoor on a target system as opposed to specifying a malicious binpath. More stealthy and harder to detect because a binary isn't dropped on the system and the .bat is deleted upon execution.
references: 
    - https://book.hacktricks.xyz/windows-hardening/lateral-movement/smbexec
    - https://en.wikipedia.org/wiki/COMSPEC
logsource:
  product: windows
  service: system
detection:
  selection_1:
    EventID: 7045
  selection_2:
    Service_File_Name|contains:
      - '%COMSPEC%'
      - '%TEMP%'
      - 'execute.bat'
  condition:
    selection_1 and selection_2
  tags:
  - attack.execution
  - attack.t1569
  level: high
